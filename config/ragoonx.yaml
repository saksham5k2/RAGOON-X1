llm:
  provider: groq
  model: llama-3.3-70b-versatile
  api_key: ${GROQ_API_KEY}

embedding:
  provider: sentence-transformers
  model: BAAI/bge-small-en-v1.5

retrieval:
  top_k: 10
  rewrite: true
  multi_query: true
  rerank: true
  compress: true

chunking:
  strategy: recursive
  chunk_size: 750
  overlap: 150

storage:
  provider: qdrant
  path: ./db

data:
  source: ./documents
